# Publishes docs/wiki/ to the GitHub wiki (github.com/zmsl/hekili/wiki) when a final release is published, so the wiki
# always describes the latest release (docs/wiki/README.md). It runs wiki-check at the tag first and stops if it fails.
# The wiki keeps its history: the job clones the wiki repository, copies the pages over it without --delete (a page
# only on the wiki stays), commits only when something changed and does a plain push. It never runs `git init` and
# never force-pushes. Only `published` fires it, like publish.yml.
name: wiki

on:
  release:
    types: [published]

permissions:
  contents: write # the push to the wiki repository

jobs:
  wiki:
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # the release tag
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: make wiki-check # a stale table, a dead link, a label or command that names nothing: stop here
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name }}
          # The default token. Not yet verified that it can push to the .wiki.git repository; if the push is refused,
          # a personal access token with write access to this repository (a WIKI_TOKEN secret) may be needed here.
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --exclude .git --exclude data/ --exclude README.md --exclude .gitkeep docs/wiki/ "$RUNNER_TEMP/wiki/"
          sed -i "s/{{VERSION}}/${TAG}/" "$RUNNER_TEMP/wiki/_Footer.md"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki unchanged for ${TAG}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Wiki for ${TAG}"
          git push origin HEAD
