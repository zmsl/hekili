# Uploads a release to CurseForge when the user publishes its draft on GitHub (docs/publishing/README.md, "Cutting a
# release"): the release's Hekili-*.zip asset, the release body as the markdown changelog, the tag as the display name,
# and a pre-release as a beta file; then, for a final release only, the changelog job writes the notes into CHANGELOG.md
# on forever. Only `published` fires it: saving an edit, unpublishing or deleting does not.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read # download the release asset (the changelog job raises its own to write)

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # the tag's tools/cf_upload.py
      - name: Download the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern 'Hekili-*.zip' --dir dist
          zips=(dist/Hekili-*.zip)
          [ ${#zips[@]} -eq 1 ] && [ -s "${zips[0]}" ] || { echo "expected one Hekili-*.zip asset on $TAG: ${zips[*]}"; exit 1; }
      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 tools/cf_upload.py "$GITHUB_EVENT_PATH" dist/Hekili-*.zip

  # A final release's notes become its CHANGELOG.md section on forever (tools/changelog_release.py), so the file is
  # never edited by hand for a release. A workflow pushing to forever is the user's decision (2026-10-19).
  changelog:
    needs: curseforge
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the push to forever
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forever
          fetch-depth: 0 # the push retry rebases onto a newer forever
          persist-credentials: true # this job pushes; it runs no third-party code
      - name: Write the release into CHANGELOG.md
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" # the tool diffs against the tag's changelog
          jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/body.md"
          python3 tools/changelog_release.py "$TAG" "$RUNNER_TEMP/body.md" CHANGELOG.md
          git diff --quiet -- CHANGELOG.md && { echo "CHANGELOG.md already has $TAG"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): $TAG released [skip ci]" -- CHANGELOG.md
          # one retry after a race with another merge
          git push origin HEAD:forever || { git pull --rebase origin forever && git push origin HEAD:forever; }
